apiVersion: storage.halo.run/v1alpha1
kind: PolicyTemplate
metadata:
  # used to determine whether a file should be handled by us
  name: chenhe-lsky-pro
spec:
  displayName: Lsky Pro 兰空图床
  settingName: chenhe-lsky-pro-policy-template-setting
---

apiVersion: v1alpha1
kind: Setting
metadata:
  name: chenhe-lsky-pro-policy-template-setting
spec:
  forms:
    - group: default
      formSchema:
        - $formkit: verificationForm
          action: "/apis/lsky-pro.chenhe.me/v1/policies/validation"
          label: 验证图床设置
          children:
            - $formkit: url
              name: lskyUrl
              label: Lsky Pro 地址
              help: "Lsky Pro 图床地址，必须以 http(s):// 开头，无需添加 '/' 或 api 后缀。"
              placeholder: "https://img.example.com"
              validation: required|url
              validation-visibility: live
            - $formkit: select
              name: apiVersion
              label: API 版本
              help: "选择图床 API 版本。开源版选 v1，商业版选 v2。"
              options:
                - label: "v1（开源版）"
                  value: "v1"
                - label: "v2（商业版）"
                  value: "v2"
            - $formkit: text
              name: lskyToken
              label: API Token
              help: 'v1 格式类似 x|xxxxxxx。v2 为商业版 Token。留空则以游客身份上传。'
              placeholder: "x|xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            - $formkit: number
              name: lskyStrategy
              label: 储存策略 ID
              help: 'v1 对应 strategy_id 参数（可留空）；v2 对应 storage_id 参数，商业版必填。只能输入整数。'
              validation: 'min:0'
            - $formkit: number
              name: lskyAlbumId
              label: Lsky Pro 相册 ID
              help: '可选。用于指定上传图片所属的相册 ID，留空则不指定。需要付费版兰空图床方能生效。'
              validation: 'min:0'
            - $formkit: text
              name: instanceId
              label: 实例 ID
              help: "可选。用于重装插件或 Lsky Pro 地址变更时保持已上传附件的关联状态。与此值匹配的附件视为由此存储策略管理。中途修改将导致之前上传的图片无法关联到 LskyPro。留空默认使用图床地址。"
              validation: [ [ 'matches', '/^[\w-]+$/' ] ]
              validation-visibility: live
              validation-messages:
                matches: "仅支持字母、数字、下划线 '_' 与短横线 '-'。"
            - $el: 'p'
              attrs:
                style: { padding-top: '10px' }
              children: '提示：受限于 Lsky Pro，本插件仅支持图片类型的附件。v2 商业版支持删除同步（按图片 ID），v1 删除按 key。'
