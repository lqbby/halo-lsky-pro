apiVersion: storage.halo.run/v1alpha1
kind: PolicyTemplate
metadata:
  # used to determine whether a file should be handled by us
  name: chenhe-lsky-pro
spec:
  displayName: Lsky Pro 兰空图床
  settingName: chenhe-lsky-pro-policy-template-setting
---

apiVersion: v1alpha1
kind: Setting
metadata:
  name: chenhe-lsky-pro-policy-template-setting
spec:
  forms:
    - group: default
      formSchema:
        - $formkit: verificationForm
          action: "/apis/lsky-pro.chenhe.me/v1/policies/validation"
          label: 验证图床设置
          children:
            - $formkit: url
              name: lskyUrl
              label: Lsky Pro 地址
              help: "Lsky Pro 图床地址，必须以 http(s):// 开头，无需添加 '/' 或 api 后缀。"
              placeholder: "https://img.example.com"
              validation: required|url
              validation-visibility: live
            - $formkit: select
              name: apiVersion
              label: API 版本
              help: "选择图床 API 版本。开源版选 v1，商业版选 v2。"
              options:
                - label: "v1（开源版）"
                  value: "v1"
                - label: "v2（商业版）"
                  value: "v2"
            - $formkit: text
              name: lskyToken
              label: API Token
              help: 'v1 格式类似 x|xxxxxxx。v2 为商业版 Token。留空则以游客身份上传。'
              placeholder: "x|xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            - $formkit: number
              name: lskyStrategy
              label: 储存策略 ID
              help: 'v1 对应 strategy_id 参数（可留空）；v2 对应 storage_id 参数，商业版必填。只能输入整数。'
              validation: 'min:0'
            - $formkit: number
              name: lskyAlbumId
              label: Lsky Pro 相册 ID
              help: '可选。用于指定上传图片所属的相册 ID，留空则不指定。需要付费版兰空图床方能生效。'
              validation: 'min:0'
            - $formkit: switch
              name: autoAlbum
              label: 按日期自动归档到相册
              help: '仅 v2 商业版。勾选后，若未指定相册 ID，将按「yyyy-MM」（如 2026-09）自动创建或复用相册。'
              value: false
            - $formkit: switch
              name: removeExif
              label: 移除图片 EXIF 信息
              help: '仅 v2 商业版。勾选后上传时剥离 EXIF（拍摄位置、设备型号等隐私信息）。'
              value: false
            - $formkit: switch
              name: publicImage
              label: 设为公开图片
              help: '仅 v2 商业版。勾选后上传的图片在广场公开可见。'
              value: false
            - $formkit: text
              name: instanceId
              label: 实例 ID
              help: "可选。用于重装插件或 Lsky Pro 地址变更时保持已上传附件的关联状态。与此值匹配的附件视为由此存储策略管理。中途修改将导致之前上传的图片无法关联到 LskyPro。留空默认使用图床地址。"
              validation: [ [ 'matches', '/^[\w-]+$/' ] ]
              validation-visibility: live
              validation-messages:
                matches: "仅支持字母、数字、下划线 '_' 与短横线 '-'。"
            - $el: 'p'
              attrs:
                style: { padding-top: '10px' }
              children: '提示：受限于 Lsky Pro，本插件仅支持图片类型的附件。v2 商业版支持删除同步（按图片 ID）、按日期自动归档、去 EXIF、公开图片，以及云处理缩略图（需在兰空后台开启「云处理 → 支持参数 w」）。v1 删除按 key。'
            - $el: 'p'
              attrs:
                style: { padding-top: '10px' }
              children: '如何查「储存策略 ID」：兰空后台「储存」页面，鼠标悬停/进入策略即可见其 ID；「相册 ID」可在兰空后台「相册」页或点击本页「验证图床设置」后查看 Halo 日志中输出的相册列表。'
